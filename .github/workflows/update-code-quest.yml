name: Update CODE QUEST

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-code-quest.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-code-quest.yml'

permissions:
  contents: read

concurrency:
  group: code-quest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_code_quest.py --check
      - run: python scripts/generate_arcade.py --check
      - run: python scripts/generate_code_snake.py --check

  update:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch real contributions and generate animation
        run: python scripts/generate_code_quest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate arcade from the same saved contribution calendar
        run: python scripts/generate_arcade.py
      - name: Generate Code Snake from the same saved contribution calendar
        run: python scripts/generate_code_snake.py
      - name: Validate generated calendar and SVG
        run: |
          python scripts/generate_code_quest.py --check
          python scripts/generate_arcade.py --check
          python scripts/generate_code_snake.py --check
          python -m unittest discover -s tests -v
      - name: Publish only changed artifacts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/code-quest/calendar.json assets/code-quest/code-quest.svg assets/code-quest/code-quest-static.svg assets/arcade/barrel-quest.svg assets/arcade/barrel-quest-static.svg assets/code-snake/code-snake.svg assets/code-snake/code-snake-mobile.svg assets/code-snake/code-snake-static.svg assets/code-snake/code-snake-static-mobile.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar unchanged. No commit needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(profile): atualiza calendario CODE QUEST'
          git push origin "HEAD:${DEFAULT_BRANCH}"
