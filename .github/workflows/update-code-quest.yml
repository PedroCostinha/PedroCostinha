name: Update CODE QUEST

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-code-quest.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-code-quest.yml'

permissions:
  contents: read

concurrency:
  group: code-quest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_code_quest.py --check

  update:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch real contributions and generate animation
        run: python scripts/generate_code_quest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate generated calendar and SVG
        run: |
          python scripts/generate_code_quest.py --check
          python -m unittest discover -s tests -v
      - name: Publish only changed artifacts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/code-quest/calendar.json assets/code-quest/code-quest.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar unchanged. No commit needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(profile): atualiza calendario CODE QUEST'
          git push origin "HEAD:${DEFAULT_BRANCH}"
